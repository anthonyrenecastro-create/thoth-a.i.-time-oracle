name: Refresh live data snapshot

# Rebuilds public/data/live-state.json from the OpenRouter catalog and
# Hugging Face, and commits it if it changed. The app's twins are built
# from this snapshot, so this is what keeps the forecasts live.
# See docs/live-data-plan.md.

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data
        run: python3 scripts/ingest_live_data.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live-state.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh live ecosystem snapshot"
            git push
          fi
